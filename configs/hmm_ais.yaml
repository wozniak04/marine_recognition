experiment_name: hmm_ais_v1
variant: B
random_seed: 42

paths:
  raw_dir: data/raw/classified
  ports_csv: data/ports/EU_Port_Codes.csv
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports

data:
  source: ais
  input_files: []
  labeled: false
  sampling_interval_seconds: 60

preprocessing:
  drop_zero_coords: true
  apply_smoothing: false

outlier:
  method: iqr
  iqr_multiplier: 3.0
  max_speed_knots: 30.0
  columns: []

port:
  radius_meters: 5000.0

features:
  window_size: 15
  stride: 1

model:
  name: hmm_ais
  params:
    ais_file: Ship_Operation_example_dateset_AIS_based_data.csv
    rolling_window: 30
    feature_cols:
      - sog_knots
      - rolling_spread_m
      - rolling_net_displacement_m

training:
  test_size: 0.2
  validation_size: 0.15
  split_strategy: episode
  class_weights: balanced
