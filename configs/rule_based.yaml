experiment_name: rule_v1
random_seed: 42

paths:
  raw_dir: data/raw
  ports_dir: data/ports
  preprocessed_dir: data/preprocessed
  models_dir: models
  reports_dir: reports

data:
  input_files:
    # - Ship_Operation_example_dataset_classified.csv
    # - Ship_Operation_example_dataset_classified_2.csv
    - Ship_Operation_example_dataset_unclassified_source_GPS_2.csv

preprocessing:
  rolling_window: 100
  reverse: True

port:
  radius_meters: 2000.0
  shifting_sog_kn: 0.5

# Reguly klasyfikacji — sprawdzane po kolei, pierwsza pasujaca wygrywa.
# Dostepne cechy z preprocessingu:
#   rolling_sog_kn, rolling_sog_std, rolling_spread_m,
#   rolling_net_displacement_m, rolling_accel_abs, rolling_rot_abs,
#   rolling_cog_std, sog_knots, acceleration, rot, cog
#
# Warunki: min, max, abs_min (|wartosc| >= X), abs_max, min_ratio
#
# Klasy portowe (in_port, in_port_shifting, in_port_arrival, in_port_departure)
# sa przypisywane automatycznie w postprocessingu na podstawie in_port z bazy portow.
model:
  name: rule_based
  min_episode_minutes: {
    at_sea_turn: 1,
    other: 20
  }
  rules:
    # 1. At Sea Turn: predkosc voyage + wysoki rot (skret na morzu)
    - state: at_sea_turn
      confidence: 80
      conditions:
        rolling_sog_kn: {min: 3.0}
        rot: {abs_min: 2.5}

    # 2. Voyage: wysoka srednia predkosc
    - state: voyage
      confidence: 85
      conditions:
        rolling_sog_kn: {min: 3.0}

    # 3. In Port: prawie zerowy ruch — zacumowany przy nabrzezu
    - state: in_port
      confidence: 85
      conditions:
        in_port: 1
        rolling_sog_kn: {max: 0.15}
        rolling_spread_m: {max: 25.0}

    # 4. In Port Shifting: powolny celowy ruch w ograniczonym obszarze (miedzy nabrzezami)
    - state: in_port_shifting
      confidence: 75
      conditions:
        in_port: 1
        rolling_sog_kn: {min: 0.15, max: 2.0}
        rolling_spread_m: {max: 500.0}
        rolling_net_displacement_m: {min: 30.0}

    # 5. Adrift: niska predkosc, duzy spread, statek znoszony w jednym kierunku
    - state: adrift
      confidence: 70
      conditions:
        rolling_sog_kn: {min: 0.3, max: 3.0}
        rolling_spread_m: {min: 200.0}
        rolling_net_displacement_m:
          min_ratio: {of: rolling_spread_m, value: 0.3}

    # 6. Anchor: niska predkosc, sredni spread
    - state: anchor
      confidence: 70
      conditions:
        rolling_sog_kn: {max: 0.5}
        rolling_spread_m: {max: 200.0}

    # 7. Anchor fallback: sredni spread
    - state: anchor
      confidence: 40
      conditions:
        rolling_spread_m: {max: 200.0}

    # 8. Default: duzy spread = adrift
    - state: adrift
      confidence: 35
      conditions: {}

training:
  test_size: 0.2
  validation_size: 0.15
  oversampling_max_ratio: 3
